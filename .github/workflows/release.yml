name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0-alpha)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up QEMU and binfmt-support (for multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Extract Version Tag
        id: get_version
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.version || github.ref_name }}"
          # Strip leading 'v' if present (e.g. v1.0.0-alpha -> 1.0.0-alpha)
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building katusaOS version: ${VERSION} for ${{ matrix.arch }}"

      - name: Build, Compress and Prepare Release Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          ARTIFACT_DIR="${{ runner.temp }}/release-artifacts"
          mkdir -p "${ARTIFACT_DIR}"

          # Build builder image
          docker build -t katusaos-builder:latest -f docker/Dockerfile.builder docker/

          # Build disk image directly into runner temp directory (no output/ directory created in workspace)
          docker run --rm --privileged \
            -v "${PWD}:/workspace" \
            -v "${ARTIFACT_DIR}:/release-output" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e IMAGE_SIZE_MB=4096 \
            -e OUTPUT_DIR=/release-output \
            katusaos-builder:latest \
            /workspace/scripts/build-image.sh "${ARCH}"

          # Fix permissions on runner temp directory
          sudo chown -R $(id -u):$(id -g) "${ARTIFACT_DIR}"

          # Rename and compress image using multi-threaded xz
          RAW_IMG="${ARTIFACT_DIR}/katusaOS-${ARCH}.img"
          TARGET_IMG="${ARTIFACT_DIR}/katusaOS-${VERSION}-${ARCH}.img"
          mv "${RAW_IMG}" "${TARGET_IMG}"
          echo "[+] Compressing ${TARGET_IMG} with xz (multi-threaded)..."
          xz -T0 -6 -v "${TARGET_IMG}"

          # Rename installer ISO if present
          RAW_ISO="${ARTIFACT_DIR}/katusaOS-${ARCH}-installer.iso"
          TARGET_ISO="${ARTIFACT_DIR}/katusaOS-${VERSION}-${ARCH}-installer.iso"
          if [ -f "${RAW_ISO}" ]; then
            mv "${RAW_ISO}" "${TARGET_ISO}"
          fi

          # Generate SHA256 checksums
          cd "${ARTIFACT_DIR}"
          sha256sum "katusaOS-${VERSION}-${ARCH}.img.xz" > "katusaOS-${VERSION}-${ARCH}.img.xz.sha256"
          if [ -f "katusaOS-${VERSION}-${ARCH}-installer.iso" ]; then
            sha256sum "katusaOS-${VERSION}-${ARCH}-installer.iso" > "katusaOS-${VERSION}-${ARCH}-installer.iso.sha256"
          fi
          cd -

          echo "[+] Artifacts ready for release:"
          ls -lh "${ARTIFACT_DIR}"

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ runner.temp }}/release-artifacts/katusaOS-*.img.xz
            ${{ runner.temp }}/release-artifacts/katusaOS-*.img.xz.sha256
            ${{ runner.temp }}/release-artifacts/katusaOS-*-installer.iso
            ${{ runner.temp }}/release-artifacts/katusaOS-*-installer.iso.sha256
            ${{ runner.temp }}/release-artifacts/vmlinuz-*
            ${{ runner.temp }}/release-artifacts/initrd-*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
