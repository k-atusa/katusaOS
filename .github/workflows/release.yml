name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0-alpha)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up QEMU and binfmt-support (for multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Extract Version Tag
        id: get_version
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.version || github.ref_name }}"
          # Strip leading 'v' if present (e.g. v1.0.0-alpha -> 1.0.0-alpha)
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building katusaOS version: ${VERSION} for ${{ matrix.arch }}"

      - name: Build katusaOS Image via Docker
        run: |
          # Build builder image
          docker build -t katusaos-builder:latest -f docker/Dockerfile.builder docker/

          # Build full 4GB disk image
          docker run --rm --privileged \
            -v "${PWD}:/workspace" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e IMAGE_SIZE_MB=4096 \
            katusaos-builder:latest \
            /workspace/scripts/build-image.sh ${{ matrix.arch }}

          # Fix file ownership from root (Docker) to runner user
          sudo chown -R $(id -u):$(id -g) output/

      - name: Rename, Compress (XZ) and Generate Checksums
        id: prepare_artifact
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch }}"
          RAW_IMG="output/katusaOS-${VERSION}-${ARCH}.img"
          XZ_IMG="output/katusaOS-${VERSION}-${ARCH}.img.xz"

          # Rename raw image
          mv "output/katusaOS-${ARCH}.img" "${RAW_IMG}"
          echo "[+] Compressing ${RAW_IMG} with xz (multi-threaded)..."

          # Compress to .xz (reduces ~4GB image to ~350MB)
          xz -T0 -6 -v "${RAW_IMG}"

          # Generate SHA256 checksum
          cd output
          sha256sum "katusaOS-${VERSION}-${ARCH}.img.xz" > "katusaOS-${VERSION}-${ARCH}.img.xz.sha256"
          cd ..

          echo "[+] Artifact prepared: ${XZ_IMG} ($(du -h "${XZ_IMG}" | cut -f1))"
          ls -lh output/

          echo "xz_path=${XZ_IMG}" >> $GITHUB_OUTPUT
          echo "sha_path=output/katusaOS-${VERSION}-${ARCH}.img.xz.sha256" >> $GITHUB_OUTPUT

      - name: Upload Compressed Image to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            ${{ steps.prepare_artifact.outputs.xz_path }}
            ${{ steps.prepare_artifact.outputs.sha_path }}
            output/vmlinuz-${{ matrix.arch }}
            output/initrd-${{ matrix.arch }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
