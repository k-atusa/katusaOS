# katusaOS Default Tmux Configuration

# Enable mouse support
set -g mouse on

# Set prefix key to Ctrl-A (optional, keeping default or enabling screen-like bindings)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Modern colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar styling
set -g status-style bg=colour235,fg=colour137
set -g status-left '#[fg=colour232,bg=colour45,bold] katusaOS #[fg=colour235,bg=colour235] '
set -g status-right '#[fg=colour250,bg=colour238] %Y-%m-%d %H:%M #[default]'

# Start window index at 1
set -g base-index 1
setw -g pane-base-index 1
